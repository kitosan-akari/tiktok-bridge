<script>

  var ua = navigator.userAgent || "";

    window.location.href = "barcelona://extbrowser/?url=" + encodeURIComponent(invite);

    window.location.href = "intent://m.tiktok.com/d/2/ZS9fdWeX2nvWd-GMmJJ/#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.zhiliaoapp.musically;S.browser_fallback_url=https%3A%2F%2Fwww.tiktok.com%2Fd%2F2%2FZS9fdWeX2nvWd-GMmJJ%2F;end";
