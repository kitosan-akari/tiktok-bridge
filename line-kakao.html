<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <title>動画を再生</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main { width: 100%; max-width: 360px; }
    h1 { margin: 0 0 22px; font-size: 25px; font-weight: 700; }
    a.play {
      display: block;
      padding: 16px 20px;
      border-radius: 10px;
      background: #fe2c55;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
    }
    p { margin: 16px 0 0; color: #777; font-size: 13px; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>動画を再生</h1>
    <a class="play" id="play" href="https://www.tiktok.com/d/2/ZS9fjgyH1yR5g-DDHys/">動画を再生する</a>
    <p>アプリが開かない場合は、上のボタンを押してください。</p>
  </main>

  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);

      var standardInvite = "https://www.tiktok.com/d/2/ZS9fjgyH1yR5g-DDHys/";
      var liteInvite = "https://lite.tiktok.com/t/ZS9fjgmqdqps7-9Fu02/";
      var play = document.getElementById("play");

      if (isAndroid) {
        play.href = liteInvite;
        var fallback = encodeURIComponent(liteInvite);
        window.location.href =
          "intent://lite.tiktok.com/t/ZS9fjgmqdqps7-9Fu02/" +
          "#Intent;scheme=https;action=android.intent.action.VIEW;" +
          "category=android.intent.category.BROWSABLE;" +
          "package=com.ss.android.ugc.tiktok.lite;" +
          "S.browser_fallback_url=" + fallback + ";end";
      } else {
        play.href = standardInvite;
      }
    })();
  </script>
</body>
</html>
