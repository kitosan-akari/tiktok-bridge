<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Lite 招待リンク</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:520px;margin:12vh auto;padding:24px;line-height:1.7;text-align:center}
a{display:block;padding:16px;margin:18px 0;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:700}
.secondary{background:#eee;color:#111}
small{color:#666}
</style>
</head>
<body>
<h2>TikTok Liteを開く</h2>
<p>下のボタンを押してください。</p>
<a id="app" href="intent://lite.tiktok.com/t/ZS9yoDJT8nwgT-UBuHf/#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.ss.android.ugc.tiktok.lite;S.browser_fallback_url=https%3A%2F%2Flite.tiktok.com%2Ft%2FZS9yoDJT8nwgT-UBuHf%2F;end">TikTok Liteアプリで開く</a>
<a class="secondary" href="https://lite.tiktok.com/t/ZS9yoDJT8nwgT-UBuHf/">招待リンクを開く（うまくいかない場合）</a>
<small>アプリが起動しない場合は、TikTok Liteがインストールされているか確認してください。</small>
<script>
(function() {
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var app = document.getElementById("app");
  if (isIOS) {
    app.href = "barcelona://extbrowser/?url=" + encodeURIComponent("https://lite.tiktok.com/t/ZS9yoDJT8nwgT-UBuHf/");
    app.textContent = "招待リンクを開く";
  } else if (!isAndroid) {
    app.href = "https://lite.tiktok.com/t/ZS9yoDJT8nwgT-UBuHf/";
    app.textContent = "招待リンクを開く";
  }
})();
</script>
</body>
</html>
