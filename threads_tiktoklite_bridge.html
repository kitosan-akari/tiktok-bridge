<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>TikTok Lite 招待リンクへ移動</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:32px 20px;background:#f7f7f7;color:#171717;text-align:center}
  main{max-width:440px;margin:12vh auto 0;background:#fff;padding:28px 22px;border-radius:18px;box-shadow:0 4px 22px #0000000d}
  h1{font-size:21px;margin:0 0 12px}
  p{font-size:15px;line-height:1.7;color:#555}
  a.button{display:block;margin:22px auto 10px;padding:15px 18px;border-radius:12px;background:#111;color:#fff;text-decoration:none;font-weight:700}
  small{display:block;margin-top:18px;color:#777;line-height:1.6}
</style>
</head>
<body>
<main>
  <h1>TikTok Liteへ移動しています</h1>
  <p>招待リンクを開いています。自動で移動しない場合は、下のボタンを押してください。</p>
  <a class="button" id="continue" href="https://lite.tiktok.com/t/ZS9yoDJT8nwgT-UBuHf/">招待リンクを開く</a>
  <small>アプリがインストールされていない場合のストア案内は、TikTok Lite側の招待リンクの動作に従います。</small>
</main>
<script>
(function () {
  const invite = "https://lite.tiktok.com/t/ZS9yoDJT8nwgT-UBuHf/";
  const ua = navigator.userAgent || "";
  const isIOS = /iPhone|iPad|iPod/i.test(ua);
  const isAndroid = /Android/i.test(ua);
  const isThreads = /Barcelona/i.test(ua);

  // Android: ask Chrome to open the official invite URL.
  // Chrome's documented intent fallback is the same invite URL.
  function openChrome() {
    const fallback = encodeURIComponent(invite);
    const intent = "intent://lite.tiktok.com/t/ZS9yoDJT8nwgT-UBuHf/" +
      "#Intent;scheme=https;action=android.intent.action.VIEW;" +
      "package=com.android.chrome;S.browser_fallback_url=" + fallback + ";end";
    window.location.href = intent;
  }

  // iOS Threads: private/undocumented Threads external-browser handoff.
  function openSafariFromThreads() {
    const handoff = "barcelona://extbrowser/?url=" + encodeURIComponent(invite);
    window.location.replace(handoff);
    // If the private scheme is unsupported, the visible invite button remains.
  }

  if (isThreads && isIOS) {
    setTimeout(openSafariFromThreads, 250);
  } else if (isThreads && isAndroid) {
    // Android intent launches are commonly restricted without a user gesture.
    // Try once; if blocked, the visible button remains as a manual fallback.
    setTimeout(openChrome, 250);
  }
})();
</script>
</body>
</html>
