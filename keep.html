<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>続きを見る</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}
main{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 22px}
.card{width:min(100%,560px);border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 14px 38px rgba(0,0,0,.16)}
.preview{height: min(72vw, 390px);min-height:260px;background:linear-gradient(145deg,#333 0%,#555 55%,#414141 100%);display:flex;align-items:center;justify-content:center;position:relative}
.play{width:88px;height:88px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.18)}
.play:before{content:"";margin-left:7px;border-top:17px solid transparent;border-bottom:17px solid transparent;border-left:27px solid #333}
.cta-wrap{display:flex;justify-content:center;margin-top:-40px;position:relative;padding:0 18px}
.cta{display:block;width:min(100%,360px);padding:18px 20px;border-radius:999px;background:#17191e;color:#fff;text-decoration:none;text-align:center;font-size:20px;font-weight:750;letter-spacing:.01em;box-shadow:0 8px 22px rgba(0,0,0,.2)}
.caption{height:66px;background:#fff}
@media(max-width:380px){.cta{font-size:18px;padding:17px 14px}.preview{min-height:230px}}
</style>
</head>
<body>
<main>
  <section class="card" aria-label="続きを見る">
    <div class="preview"><div class="play" aria-hidden="true"></div></div>
    <div class="cta-wrap">
      <a class="cta" id="open" href="https://lite.tiktok.com/t/ZS9yoDJT8nwgT-UBuHf/">タップして続きを見る</a>
    </div>
    <div class="caption"></div>
  </section>
</main>
<script>
(function() {
  var ua = navigator.userAgent || "";
  var isThreads = /Barcelona/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  if (isIOS && isThreads) {
    window.location.href = "barcelona://extbrowser/?url=" + encodeURIComponent("https://lite.tiktok.com/t/ZS9yoDJT8nwgT-UBuHf/");
  }
})();
</script>
</body>
</html>
